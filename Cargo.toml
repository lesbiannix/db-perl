[package]
name = "transport-api-wrapper"
version = "0.1.0"
edition = "2021"

[lib]
name = "transport_api_wrapper"
crate-type = ["cdylib", "rlib"]

[features]
default = []
cli = ["clap"]
python = ["pyo3/extension-module"]
nodejs = ["neon"]
ffi = []
java = ["jni"]

[[bin]]
name = "transporter"
path = "src/bin/transporter.rs"
required-features = ["cli"]

[[test]]
name = "bootstrap"
path = "features/bootstrap/steps.rs"
harness = false

[dev-dependencies]
cucumber = "0.21.1"
gherkin = "0.14.0"
tokio = { version = "1", features = ["full"] }

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"], optional = true }
thiserror = "1.0"
quick-xml = { version = "0.22", features = ["serialize"] }
pyo3 = { version = "0.16", optional = true }
neon = { version = "0.10", optional = true }
jni = { version = "0.19.0", optional = true }
once_cell = "1.8"